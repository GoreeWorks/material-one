name: Material One Color and Skeleton Matrix

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: material-one-color-loading-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  color-loading:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node:
          - 22
          - 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Validate color and skeleton contracts
        run: npm run validate:color-loading
      - name: Validate TypeScript contracts
        run: npm run typecheck
      - name: Run Material One behavior tests
        run: npm test
      - name: Upload color and loading report
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: material-one-color-loading-report
          path: build/color-loading-report.json
          if-no-files-found: error
          retention-days: 14

  color-loading-gate:
    name: Color and skeleton CI gate
    if: always()
    runs-on: ubuntu-latest
    needs:
      - color-loading
    steps:
      - name: Verify matrix
        shell: bash
        run: test "${{ needs.color-loading.result }}" = "success"
