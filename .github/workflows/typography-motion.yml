name: Material One Typography and Motion Matrix

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: material-one-typography-motion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typography-motion:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node:
          - 22
          - 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Validate typography and motion contracts
        run: npm run validate:typography-motion
      - name: Validate TypeScript contracts
        run: npm run typecheck
      - name: Run Material One behavior tests
        run: npm test
      - name: Upload typography and motion report
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: material-one-typography-motion-report
          path: build/typography-motion-report.json
          if-no-files-found: error
          retention-days: 14

  typography-motion-gate:
    name: Typography and motion CI gate
    if: always()
    runs-on: ubuntu-latest
    needs:
      - typography-motion
    steps:
      - name: Verify matrix
        shell: bash
        run: test "${{ needs.typography-motion.result }}" = "success"
