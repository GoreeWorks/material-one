name: Material One Semantic Color Matrix

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: material-one-semantic-colors-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-colors:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node:
          - 22
          - 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Validate semantic color roles
        run: npm run validate:semantic-colors
      - name: Validate TypeScript contracts
        run: npm run typecheck
      - name: Run Material One behavior tests
        run: npm test
      - name: Upload semantic color report
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: material-one-semantic-color-report
          path: build/semantic-color-report.json
          if-no-files-found: error
          retention-days: 14

  semantic-color-gate:
    name: Semantic color CI gate
    if: always()
    runs-on: ubuntu-latest
    needs:
      - semantic-colors
    steps:
      - name: Verify matrix
        shell: bash
        run: test "${{ needs.semantic-colors.result }}" = "success"
