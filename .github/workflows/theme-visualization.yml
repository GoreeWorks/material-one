name: Material One Theme and Visualization Matrix

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: material-one-theme-visualization-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  theme-visualization:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node:
          - 22
          - 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Validate theme and visualization contracts
        run: npm run validate:theme-visualization
      - name: Validate TypeScript contracts
        run: npm run typecheck
      - name: Run Material One behavior tests
        run: npm test
      - name: Upload theme and visualization report
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: material-one-theme-visualization-report
          path: build/theme-visualization-report.json
          if-no-files-found: error
          retention-days: 14

  theme-visualization-gate:
    name: Theme and visualization CI gate
    if: always()
    runs-on: ubuntu-latest
    needs:
      - theme-visualization
    steps:
      - name: Verify matrix
        shell: bash
        run: test "${{ needs.theme-visualization.result }}" = "success"
